name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: nexora-website/package-lock.json

      - name: Install dependencies
        working-directory: ./nexora-website
        run: npm ci

      - name: Lint
        working-directory: ./nexora-website
        run: npm run lint

      - name: Run Tests
        working-directory: ./nexora-website
        run: npm run test

      - name: Build Project
        working-directory: ./nexora-website
        run: npm run build
